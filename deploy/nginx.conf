server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name medesk.lifeplusbd.tech;
    ssl_certificate /etc/letsencrypt/live/medesk.lifeplusbd.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medesk.lifeplusbd.tech/privkey.pem;
    client_max_body_size 11m;
    auth_basic "MedDesk doctor workspace";
    auth_basic_user_file /opt/meddesk/shared/dashboard.htpasswd;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    access_log /var/log/nginx/meddesk.access.log;
    error_log /var/log/nginx/meddesk.error.log;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 75s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    include /opt/meddesk/shared/proxy-secret.conf;

    location = /api/bridge/enroll {
        auth_basic off;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8792;
    }
    location = /api/bridge/uplink {
        auth_basic off;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8792;
    }
    location / {
        proxy_pass http://127.0.0.1:8792;
    }
}

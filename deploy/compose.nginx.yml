name: meddesk
services:
  app:
    image: meddesk:studio
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: server.env
    environment:
      MEDDESK_TRANSCRIPTION_URL: http://transcription:8080/inference
    networks: [default, speech]
    depends_on:
      transcription:
        condition: service_healthy
    ports: ["127.0.0.1:8792:8787"]
    volumes:
      - clinical_data:/var/lib/meddesk
    mem_limit: 512m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  transcription:
    image: ghcr.io/ggml-org/whisper.cpp@sha256:09f8f3bace5bcd98b9c7406f78c36bd98bdcc084438ce36f660ead1b776541d9
    entrypoint: ["/app/build/bin/whisper-server"]
    command: ["--host", "0.0.0.0", "--port", "8080", "-m", "/models/ggml-small-q5_1.bin", "-t", "2", "-ng", "-sns", "--convert", "--vad", "-vm", "/models/ggml-silero-v5.1.2.bin", "-d", "60000", "-bs", "1", "-bo", "1", "-nf"]
    user: "1000:1000"
    working_dir: /tmp
    read_only: true
    tmpfs: ["/tmp:size=96m,mode=1777"]
    volumes: ["/opt/meddesk/shared/speech-models:/models:ro"]
    networks: [speech]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 2
    restart: unless-stopped
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
networks:
  speech:
    internal: true
volumes:
  clinical_data:
